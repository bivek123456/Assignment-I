<!DOCTYPE html>
<html>

<head>
    <title>Bootstrap Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-secondary">
    <div class="container mt-5">
        <div class="card p-4 mx-auto" style="max-width:400px">
            <h3 class="text-center">Create Account</h3>

            <input class="form-control my-2" placeholder="Username">
            <input class="form-control my-2" type="email" placeholder="Email">
            <input class="form-control my-2" type="password" placeholder="Password">

            <button class="btn btn-success w-100 mt-2">Register</button>
        </div>
    </div>
</body>

</html>
