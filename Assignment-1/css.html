<!DOCTYPE html>
<html>

<head>
    <title>My Web Page</title>
    <style>
        body {
            font-family: Arial;
            background: #fff8e7;
            text-align: center;
            margin: 0;
        }

        h1 {
            background: #8e44ad;
            color: white;
            padding: 20px;
            margin: 0;
        }

        nav {
            background: #e67e22;
            padding: 15px;
        }

        nav a {
            color: white;
            margin: 15px;
            text-decoration: none;
        }

        .card {
            background: white;
            padding: 20px;
            margin: 30px auto;
            width: 50%;
        }

        button {
            background: #16a085;
            color: white;
            padding: 10px;
            border: 0;
        }
    </style>
</head>

<body>
    <h1>My Simple Website</h1>

    <nav>
        <a href="#">Home</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <h2>Explore Our Website</h2>
    <p>Welcome to our simple webpage.</p>

    <div class="card">
        <p>Useful information for visitors.</p>
        <button>Learn More</button>
    </div>
</body>

</html>
